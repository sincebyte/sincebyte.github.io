@startuml

    浏览器 -> 浏览器: 是否是同源请求
    浏览器 -> 浏览器: 是否是简单请求
alt 简单请求
    浏览器 -> 服务器: 是简单请求
    服务器 -> 浏览器: 返回 响应数据、跨域 Header
    浏览器 -> 浏览器: 判断服务端授权
    浏览器 -> 浏览器: 授权 OK，放开控制，获取服务端数据
end

alt 非简单请求
    浏览器 -> 服务器: 预检请求 OPTIONS
    服务器 -> 浏览器: 返回跨域 Header
    浏览器 -> 浏览器: 判断服务端授权
    浏览器 -> 服务器: 真实请求 GET/POST
    服务器 -> 浏览器: 返回 响应数据，跨域 Header
    浏览器 -> 浏览器: 判断服务端授权
    浏览器 -> 浏览器: 放开控制，获取服务端数据
end
@enduml

